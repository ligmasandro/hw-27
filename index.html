<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Sidebar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <img class="logo-nepal" src="logo.jpg" alt="">
      <span class="logo-name">CodingNepal</span>
    </div>
    <ul class="menu">
      <li class="menu-title">Main Menu</li>
      <li><i class="fas fa-table-columns"></i><span>Dashboard</span></li>
      <li><i class="fas fa-chart-line"></i><span>Revenue</span></li>
      <li><i class="fas fa-flag"></i><span>Reports</span></li>

      <li class="menu-title">Advanced</li>
      <li><i class="fas fa-user"></i><span>Designer</span></li>
      <li><i class="fas fa-users"></i><span>Developer</span></li>
      <li><i class="fas fa-laptop-code"></i><span>Magic Build</span></li>
      <li><i class="fas fa-paperclip"></i><span>Theme Maker</span></li>
      <li><i class="fas fa-chart-area"></i><span>Analytic</span></li>

      <li class="menu-title">Account</li>
      <li><i class="fas fa-bars-progress"></i><span>Overview</span></li>
      <li><i class="fas fa-envelope"></i><span>Messages</span></li>
    </ul>
  </div>
</body>
</html>
